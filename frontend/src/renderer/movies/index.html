          lightsOffBtn.textContent = 'Tắt đèn';
          lightsOffBtn.setAttribute('aria-pressed', 'false');

          const backupSourceBtn = document.createElement('button');
          backupSourceBtn.type = 'button';
          backupSourceBtn.className = 'player-action-btn';
          backupSourceBtn.textContent = 'Tìm máy chủ dự phòng';

          playerToolbar.appendChild(embedModeBtn);
          playerToolbar.appendChild(m3u8ModeBtn);
          playerToolbar.appendChild(trailerModeBtn);
          playerToolbar.appendChild(lightsOffBtn);
          playerToolbar.appendChild(backupSourceBtn);

          const playerNote = document.createElement('p');
          playerNote.className = 'player-note';

          playerBox.appendChild(playerHeader);
          playerBox.appendChild(playerStage);
          playerBox.appendChild(playerToolbar);
          playerBox.appendChild(playerNote);

          // Bảng chọn Server & Tập phim bên phải
          const epSection = document.createElement('div');
          epSection.className = 'episodes-panel';

          const epHeading = document.createElement('h3');
          epHeading.className = 'episodes-title';
          epHeading.textContent = 'Chọn server & tập phim';
          epSection.appendChild(epHeading);

          watchWorkspace.appendChild(playerBox);
          watchWorkspace.appendChild(epSection);
          modalBodyEl.appendChild(watchWorkspace);

          let activeEpisode = null;
          let activeMode = 'embed';
          let currentServerButtons = [];
          let currentEpIndex = -1;

          /**
           * Dừng phát thẻ <video> trực tiếp khi chuyển chế độ hoặc đóng modal.
           */
          function stopNativeVideo() {
            if (typeof playerVideo.pause === 'function') {
              playerVideo.pause();
            }
            playerVideo.removeAttribute('src');
            if (typeof playerVideo.load === 'function') {
              playerVideo.load();
            }
          }

          /**
           * Cập nhật trạng thái nút Tập trước / Tập tiếp dựa trên danh sách tập của server đang chọn.
           */
          function updateEpisodeStepper() {
            prevEpBtn.disabled = currentEpIndex <= 0;
            nextEpBtn.disabled =
              currentEpIndex < 0 ||
              currentEpIndex >= currentServerButtons.length - 1;
          }

          /**
           * Cập nhật nguồn phát theo chế độ máy chủ chính, trình phát trực tiếp hoặc Trailer.
           * @param {'embed'|'m3u8'|'trailer'} mode - Chế độ trình phát được chọn.
           */
          function applyPlaybackMode(mode) {
            activeMode = mode;
            const ep = activeEpisode?.ep ?? null;
            const serverName = activeEpisode?.serverName ?? 'Server';
            const epName = ep?.name ?? 'Tập';
            const embedUrl = ep?.link_embed || '';
            const m3u8Url = ep?.link_m3u8 || '';

            embedModeBtn.disabled = !embedUrl;
            m3u8ModeBtn.disabled = !m3u8Url;
            trailerModeBtn.disabled = !trailerEmbedUrl;

            embedModeBtn.classList.toggle('is-active', mode === 'embed');
            m3u8ModeBtn.classList.toggle('is-active', mode === 'm3u8');
            trailerModeBtn.classList.toggle('is-active', mode === 'trailer');
            playerNote.classList.remove('is-warning');

            if (mode === 'trailer' && trailerEmbedUrl) {
              stopNativeVideo();
              playerVideo.hidden = true;
              playerFrame.hidden = false;
              playerFrame.referrerPolicy = 'strict-origin-when-cross-origin';
              playerFrame.src = trailerEmbedUrl;
              nowPlayingEl.textContent =
                'Trailer chính thức · ' + (movie?.name ?? 'Phim');
              playerNote.textContent =
                'Đang phát Trailer. Chọn một tập ở bảng bên cạnh hoặc bấm "Máy chủ chính" để quay lại xem phim.';
              return;
            }

            if (mode === 'm3u8' && m3u8Url) {
              playerFrame.src = '';
              playerFrame.hidden = true;
              playerVideo.hidden = false;
              playerVideo.src = m3u8Url;
              nowPlayingEl.textContent =
                serverName + ' · ' + epName + ' (Trực tiếp)';
              playerNote.textContent =
                'Đang sử dụng trình phát trực tiếp. Nếu trình duyệt không phát được luồng này, hãy quay lại "Máy chủ chính" hoặc chọn server khác.';
              return;
            }

            stopNativeVideo();
            playerVideo.hidden = true;
            playerFrame.hidden = false;
            playerFrame.referrerPolicy = 'no-referrer';
            playerFrame.src = embedUrl;
            nowPlayingEl.textContent = ep
              ? serverName + ' · ' + epName
              : movie?.name ?? 'Trình phát phim';

            playerNote.textContent =
              'Nếu khung phát tải chậm hoặc bị gián đoạn, hãy bấm "Tìm máy chủ dự phòng", đổi server bên cạnh hoặc xem Trailer.';
          }

          /**
           * Chọn một tập phim để phát và đồng bộ trạng thái nút đang chọn cùng bộ đếm Tập trước/tiếp.
           * @param {HTMLButtonElement} btnEl - Nút tập phim vừa được chọn.
           * @param {string} serverLabel - Tên server chứa tập phim.
           * @param {Object} episodeObj - Dữ liệu tập phim gồm link_embed và link_m3u8.
           * @param {Array<HTMLButtonElement>} serverBtns - Danh sách nút tập thuộc server hiện tại.
           * @param {number} epIndex - Vị trí tập trong server hiện tại.
           * @param {boolean} shouldScroll - Có cuộn modal lên đầu trình phát hay không.
           */
          function selectEpisodeToPlay(
            btnEl,
            serverLabel,
            episodeObj,
            serverBtns,
            epIndex,
            shouldScroll
          ) {
            epSection
              .querySelectorAll('.ep-btn.is-playing')
              .forEach(function (btn) {
                btn.classList.remove('is-playing');
              });
            btnEl.classList.add('is-playing');
            activeEpisode = { serverName: serverLabel, ep: episodeObj };
            currentServerButtons = serverBtns;
            currentEpIndex = epIndex;
            updateEpisodeStepper();
            playerBox.hidden = false;

            if (episodeObj?.link_embed) {
              applyPlaybackMode('embed');
            } else if (episodeObj?.link_m3u8) {
              applyPlaybackMode('m3u8');
            } else if (trailerEmbedUrl) {
              applyPlaybackMode('trailer');
            }

            if (shouldScroll && typeof modalBodyEl.scrollTo === 'function') {
              modalBodyEl.scrollTo({ top: 0, behavior: 'smooth' });
            }
          }

          /**
           * Dựng danh sách các khối server và nút chọn tập vào bảng chọn tập bên phải.
           * @param {Array<Object>} serverList - Mảng server từ API episodes.
           * @returns {Function|null} Hàm kích hoạt tập đầu tiên nếu có.
           */
          function appendServerBlocks(serverList) {
            let firstAction = null;
            serverList.forEach(function (server) {
              const serverBlock = document.createElement('div');
              serverBlock.className = 'server-block';

              const serverLabel = server?.server_name ?? 'Server mặc định';
              const serverName = document.createElement('div');
              serverName.className = 'server-name';
              serverName.textContent = serverLabel;

              const epList = document.createElement('div');
              epList.className = 'episode-list';

              const serverBtns = [];
              (server?.server_data ?? []).forEach(function (ep, epIndex) {
                const epBtn = document.createElement('button');
                epBtn.type = 'button';
                epBtn.className = 'ep-btn';
                epBtn.textContent = ep?.name ?? 'Tập';
                epBtn.title = ep?.name ?? 'Tập';
                serverBtns.push(epBtn);

                epBtn.addEventListener('click', function () {
                  selectEpisodeToPlay(
                    epBtn,
                    serverLabel,
                    ep,
                    serverBtns,
                    epIndex,
                    true
                  );
                });

                if (
                  !firstAction &&
                  (ep?.link_embed || ep?.link_m3u8)
                ) {
                  firstAction = function () {
                    selectEpisodeToPlay(
                      epBtn,
                      serverLabel,
                      ep,
                      serverBtns,
                      epIndex,
                      false
                    );
                  };
                }
                epList.appendChild(epBtn);
              });

              serverBlock.appendChild(serverName);
              serverBlock.appendChild(epList);
              epSection.appendChild(serverBlock);
            });
            return firstAction;
          }

          let firstPlayableAction = null;
          if (episodes.length === 0) {
            const noEp = document.createElement('p');
            noEp.className = 'summary-text';
            noEp.textContent = 'Phim hiện chưa có tập phát nào.';
            epSection.appendChild(noEp);
          } else {
            firstPlayableAction = appendServerBlocks(episodes);
          }

          embedModeBtn.addEventListener('click', function () {
            if (activeEpisode?.ep?.link_embed) {
              applyPlaybackMode('embed');
            }
          });

          m3u8ModeBtn.addEventListener('click', function () {
            if (activeEpisode?.ep?.link_m3u8) {
              applyPlaybackMode('m3u8');
            }
          });

          trailerModeBtn.addEventListener('click', function () {
            if (trailerEmbedUrl) {
              applyPlaybackMode('trailer');
            }
          });

          lightsOffBtn.addEventListener('click', function () {
            const isOff = movieModalEl.classList.toggle('is-lights-off');
            lightsOffBtn.classList.toggle('is-active', isOff);
            lightsOffBtn.textContent = isOff ? 'Bật đèn' : 'Tắt đèn';
            lightsOffBtn.setAttribute('aria-pressed', isOff ? 'true' : 'false');
          });

          prevEpBtn.addEventListener('click', function () {
            if (currentEpIndex > 0 && currentServerButtons[currentEpIndex - 1]) {
              currentServerButtons[currentEpIndex - 1].click();
            }
          });

          nextEpBtn.addEventListener('click', function () {
            if (
              currentEpIndex >= 0 &&
              currentEpIndex < currentServerButtons.length - 1 &&
              currentServerButtons[currentEpIndex + 1]
            ) {
              currentServerButtons[currentEpIndex + 1].click();
            }
          });

          backupSourceBtn.addEventListener('click', async function () {
            backupSourceBtn.disabled = true;
            backupSourceBtn.textContent = 'Đang tìm máy chủ...';
            try {
              const backup = await fetchBackupSources(movie?.name);
              if (!backup || backup.servers.length === 0) {
                playerNote.classList.add('is-warning');
                playerNote.textContent =
                  'Hiện chưa tìm thấy bản trùng khớp trên máy chủ dự phòng.';
                backupSourceBtn.textContent = 'Chưa có nguồn dự phòng';
                return;
              }
              const firstBackupAction = appendServerBlocks(backup.servers);
              backupSourceBtn.textContent = 'Đã thêm máy chủ dự phòng';
              playerNote.classList.remove('is-warning');
              playerNote.textContent =
                'Đã bổ sung máy chủ dự phòng cho "' +
                backup.matchedTitle +
                '" vào bảng chọn tập bên cạnh.';
              if (firstBackupAction) {
                firstBackupAction();
              }
            } catch (err) {
              playerNote.classList.add('is-warning');
              playerNote.textContent =
                err instanceof Error
                  ? err.message
                  : 'Lỗi khi tìm máy chủ dự phòng.';
              backupSourceBtn.disabled = false;
              backupSourceBtn.textContent = 'Thử tìm lại';
            }
          });

          playerVideo.addEventListener('error', function () {
            if (activeMode !== 'm3u8') return;
            playerNote.classList.add('is-warning');
            playerNote.textContent =
              'Trình duyệt hiện tại không phát được luồng trực tiếp này. Hãy chuyển sang "Máy chủ chính" hoặc bấm "Tìm máy chủ dự phòng".';
          });

          // Thông tin chi tiết phim bên dưới khu vực rạp chiếu
          const layout = document.createElement('div');
          layout.className = 'detail-layout';

          const posterImg = document.createElement('img');
          posterImg.className = 'detail-poster';
          posterImg.src = buildPosterUrl(
            movie?.poster_url || movie?.thumb_url || '',
            movie?.name
          );
          posterImg.alt = 'Poster ' + (movie?.name ?? 'Phim');
          posterImg.referrerPolicy = 'no-referrer';
          posterImg.addEventListener('error', function onDetailImgErr() {
            posterImg.removeEventListener('error', onDetailImgErr);
            posterImg.src = createPlaceholderImage(movie?.name);
          });

          const infoCol = document.createElement('div');

          const titleEl = document.createElement('h2');
          titleEl.id = 'modalMovieTitle';
          titleEl.className = 'detail-title';
          titleEl.textContent = movie?.name ?? 'Chưa rõ tên phim';

          const originEl = document.createElement('p');
          originEl.className = 'detail-origin';
          originEl.textContent = movie?.origin_name ?? '';

          const factsEl = document.createElement('p');
          factsEl.className = 'detail-facts';
          const factParts = [
            movie?.year ?? 'N/A',
            movie?.episode_current ?? '',
            movie?.time ?? '',
            movie?.quality ?? '',
            movie?.lang ?? '',
          ].filter(Boolean);
          if (movie?.tmdb?.vote_average) {
            factParts.push('TMDB ' + movie.tmdb.vote_average);
          }
          if (movie?.imdb?.id) {
            factParts.push('IMDb ' + movie.imdb.id);
          }
          factsEl.textContent = factParts.join(' · ');

          const descEl = document.createElement('p');
          descEl.className = 'detail-desc';
          descEl.textContent = stripHtmlTags(movie?.content);

          const extraEl = document.createElement('div');
          extraEl.className = 'detail-extra';

          const categoriesText = (movie?.category ?? [])
            .map(function (c) {
              return c?.name;
            })
            .filter(Boolean)
            .join(', ');
          const countriesText = (movie?.country ?? [])
            .map(function (c) {
              return c?.name;
            })
            .filter(Boolean)
            .join(', ');
          const actorsText = (movie?.actor ?? []).filter(Boolean).join(', ');
          const directorsText = (movie?.director ?? [])
            .filter(Boolean)
            .join(', ');

          [
            ['Thể loại', categoriesText || 'Đang cập nhật'],
            ['Quốc gia', countriesText || 'Đang cập nhật'],
            ['Đạo diễn', directorsText || 'Đang cập nhật'],
            ['Diễn viên', actorsText || 'Đang cập nhật'],
          ].forEach(function (row) {
            const line = document.createElement('div');
            const strong = document.createElement('strong');
            strong.textContent = row[0] + ': ';
            line.appendChild(strong);
            line.appendChild(document.createTextNode(row[1]));
            extraEl.appendChild(line);
          });

          infoCol.appendChild(titleEl);
          infoCol.appendChild(originEl);
          infoCol.appendChild(factsEl);
          infoCol.appendChild(descEl);
          infoCol.appendChild(extraEl);

          layout.appendChild(posterImg);
          layout.appendChild(infoCol);
          modalBodyEl.appendChild(layout);

          // Tự động phát tập đầu tiên ngay khi mở rạp chiếu (hoặc phát Trailer nếu chưa có tập)
          if (firstPlayableAction) {
            firstPlayableAction();
          } else if (trailerEmbedUrl) {
            playerBox.hidden = false;
            applyPlaybackMode('trailer');
          }
        }

        /**
         * Gọi endpoint nội bộ lấy chi tiết phim và mở modal rạp chiếu.
         * @param {string} requestUrl - Đường dẫn yêu cầu nội bộ.
         * @returns {Promise<void>} Promise hoàn tất việc tải chi tiết phim.
         */
        async function openMovieDetailRequest(requestUrl) {
          stopModalPlayback();
          modalEndpointTextEl.textContent = 'Đang tải thông tin phim...';
          modalBodyEl.innerHTML =
            '<p class="summary-text">Đang tải thông tin phim và danh sách tập...</p>';
          movieModalEl.classList.remove('is-lights-off');

          if (typeof movieModalEl.showModal === 'function' && !movieModalEl.open) {
            movieModalEl.showModal();
          } else {
            movieModalEl.setAttribute('open', 'true');
          }

          try {
            const response = await fetch(requestUrl);
            if (!response.ok || response.status !== 200) {
              throw new Error(
                'Máy chủ tạm thời bận (mã ' + response.status + '). Vui lòng thử lại.'
              );
            }
            const payload = await response.json();
            if (payload?.status === false) {
              throw new Error(
                payload?.msg || 'Không tìm thấy phim theo yêu cầu.'
              );
            }
            renderMovieDetailModal(payload, requestUrl);
          } catch (error) {
            modalEndpointTextEl.textContent = 'Thông báo';
            modalBodyEl.innerHTML = '';
            const errBox = document.createElement('div');
            errBox.className = 'status-box is-error';
            const errTitle = document.createElement('h2');
            errTitle.className = 'status-title';
            errTitle.textContent = 'Không thể tải chi tiết phim';
            const errDesc = document.createElement('p');
            errDesc.className = 'status-desc';
            errDesc.textContent =
              error instanceof Error ? error.message : 'Lỗi kết nối máy chủ.';
            errBox.appendChild(errTitle);
            errBox.appendChild(errDesc);
            modalBodyEl.appendChild(errBox);
          }
        }

        /**
         * Lấy chi tiết phim theo slug qua máy chủ nội bộ.
         * @param {string} slug - Định danh slug của phim.
         * @returns {Promise<void>}
         */
        function fetchMovieDetail(slug) {
          const cleanSlug = encodeURIComponent(String(slug || '').trim());
          return openMovieDetailRequest(API_ORIGIN + '/movie/' + cleanSlug);
        }

        /**
         * Tra cứu phim theo mã TMDB qua máy chủ nội bộ.
         * @param {'movie'|'tv'} type - Loại phim ('movie' hoặc 'tv').
         * @param {string|number} tmdbId - Mã TMDB ID.
         * @returns {Promise<void>}
         */
        function fetchMovieByTmdb(type, tmdbId) {
          const safeType = type === 'movie' ? 'movie' : 'tv';
          const cleanId = encodeURIComponent(String(tmdbId || '').trim());
          return openMovieDetailRequest(
            API_ORIGIN + '/tmdb/' + safeType + '/' + cleanId
          );
        }

        /**
         * Dừng toàn bộ nguồn phát (iframe và video trực tiếp) và tắt chế độ Tắt đèn bên trong modal.
         */
        function stopModalPlayback() {
          movieModalEl.classList.remove('is-lights-off');
          const iframe = modalBodyEl.querySelector('iframe');
          if (iframe) {
            iframe.src = '';
          }
          const video = modalBodyEl.querySelector('video');
          if (video) {
            if (typeof video.pause === 'function') {
              video.pause();
            }
            video.removeAttribute('src');
            if (typeof video.load === 'function') {
              video.load();
            }
          }
        }

        /**
         * Đóng modal chi tiết phim và dừng trình phát video.
         */
        function closeMovieModal() {
          stopModalPlayback();
          if (typeof movieModalEl.close === 'function' && movieModalEl.open) {
            movieModalEl.close();
          } else {
            movieModalEl.removeAttribute('open');
          }
        }

        /**
         * Đặt lại toàn bộ bộ lọc và từ khoá về mặc định ban đầu rồi tải lại trang 1.
         */
        function resetAllFilters() {
          appState.mode = 'v1:phim-moi-cap-nhat';
          appState.sortField = 'modified.time';
          appState.sortType = 'desc';
          appState.sortLang = '';
          appState.category = '';
          appState.country = '';
          appState.year = '';
          appState.limit = DEFAULT_LIMIT;
          appState.keyword = '';

          searchInputEl.value = '';
          clearSearchBtnEl.hidden = true;
          categorySelectEl.value = '';
          countrySelectEl.value = '';
          yearSelectEl.value = '';
          langSelectEl.value = '';
          sortSelectEl.value = 'modified.time:desc';
          limitSelectEl.value = String(DEFAULT_LIMIT);

          syncNavigationState();
          fetchMovies(1, { field: 'modified.time', type: 'desc' });
        }

        // Sự kiện click điều hướng trên thanh Top Bar
        document.querySelectorAll('.header-nav-link[data-nav-mode]').forEach(
          function (link) {
            link.addEventListener('click', function (event) {
              event.preventDefault();
              if (appState.isLoading) return;
              const targetMode =
                link.getAttribute('data-nav-mode') || 'v1:phim-moi-cap-nhat';
              if (targetMode === 'v1:phim-moi-cap-nhat') {
                resetAllFilters();
                return;
              }
              appState.mode = targetMode;
              appState.keyword = '';
              searchInputEl.value = '';
              clearSearchBtnEl.hidden = true;
              syncNavigationState();
              fetchMovies(1);
            });
          }
        );

        // Sự kiện click lối tắt khám phá nhanh Quốc gia / Thể loại
        if (discoveryStripEl) {
          discoveryStripEl.addEventListener('click', function (event) {
            const btn = event.target.closest('.quick-chip-btn');
            if (!btn || appState.isLoading) return;

            const ctry = btn.getAttribute('data-quick-country') || '';
            const cat = btn.getAttribute('data-quick-category') || '';

            appState.mode = 'v1:phim-moi-cap-nhat';
            appState.keyword = '';
            searchInputEl.value = '';
            clearSearchBtnEl.hidden = true;

            if (ctry) {
              appState.country = appState.country === ctry ? '' : ctry;
              appState.category = '';
            } else if (cat) {
              appState.category = appState.category === cat ? '' : cat;
              appState.country = '';
            }
            countrySelectEl.value = appState.country;
            categorySelectEl.value = appState.category;

            syncNavigationState();
            fetchMovies(1);
          });
        }

        // Sự kiện chuyển tab chuyên mục
        categoryTabsEl.addEventListener('click', function (event) {
          const btn = event.target.closest('.tab-btn');
          if (!btn || appState.isLoading) return;

          const nextMode = btn.getAttribute('data-mode') || 'v1:phim-moi-cap-nhat';
          appState.mode = nextMode;
          appState.keyword = '';
          searchInputEl.value = '';
          clearSearchBtnEl.hidden = true;

          syncNavigationState();
          fetchMovies(1);
        });

        // Sự kiện tìm kiếm từ khoá
        searchFormEl.addEventListener('submit', function (event) {
          event.preventDefault();
          if (appState.isLoading) return;
          const kw = searchInputEl.value.trim();
          appState.keyword = kw;
          clearSearchBtnEl.hidden = !kw;
          fetchMovies(1);
        });

        clearSearchBtnEl.addEventListener('click', function () {
          searchInputEl.value = '';
          appState.keyword = '';
          clearSearchBtnEl.hidden = true;
          fetchMovies(1);
        });

        // Sự kiện tra cứu mã TMDB
        tmdbFormEl.addEventListener('submit', function (event) {
          event.preventDefault();
          const tmdbId = tmdbIdInputEl.value.trim();
          if (!tmdbId) {
            tmdbIdInputEl.focus();
            return;
          }
          fetchMovieByTmdb(tmdbTypeSelectEl.value, tmdbId);
        });

        // Sự kiện thay đổi các bộ lọc Thể loại, Quốc gia, Năm, Ngôn ngữ, Sắp xếp, Limit
        categorySelectEl.addEventListener('change', function () {
          appState.category = categorySelectEl.value;
          fetchMovies(1);
        });

        countrySelectEl.addEventListener('change', function () {
          appState.country = countrySelectEl.value;
          fetchMovies(1);
        });

        yearSelectEl.addEventListener('change', function () {
          appState.year = yearSelectEl.value;
          fetchMovies(1);
        });

        langSelectEl.addEventListener('change', function () {
          appState.sortLang = langSelectEl.value;
          fetchMovies(1);
        });

        sortSelectEl.addEventListener('change', function (event) {
          fetchMovies(1, event.target?.value || 'modified.time:desc');
        });

        limitSelectEl.addEventListener('change', function () {
          appState.limit = Number(limitSelectEl.value) || DEFAULT_LIMIT;
          fetchMovies(1);
        });

        // Phân trang Trước / Sau
        prevBtnEl.addEventListener('click', function () {
          if (appState.currentPage > 1 && !appState.isLoading) {
            fetchMovies(appState.currentPage - 1);
            window.scrollTo({ top: 0, behavior: 'smooth' });
          }
        });

        nextBtnEl.addEventListener('click', function () {
          if (
            appState.currentPage < appState.totalPages &&
            !appState.isLoading
          ) {
            fetchMovies(appState.currentPage + 1);
            window.scrollTo({ top: 0, behavior: 'smooth' });
          }
        });

        // Đặt lại bộ lọc & đóng modal
        resetBtnEl.addEventListener('click', resetAllFilters);
        brandLinkEl.addEventListener('click', function (event) {
          event.preventDefault();
          resetAllFilters();
        });
        closeModalBtnEl.addEventListener('click', closeMovieModal);
        movieModalEl.addEventListener('click', function (event) {
          if (event.target === movieModalEl) {
            closeMovieModal();
          }
        });
        movieModalEl.addEventListener('cancel', stopModalPlayback);

        // Khởi tạo dữ liệu ban đầu khi mở trang
        populateYearOptions();
        loadMetadataFilters();
        fetchMovies(1, {
          field: appState.sortField,
          type: appState.sortType,
        });
      })();
    </script>
  </body>
</html>
