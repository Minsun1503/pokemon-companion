name: Check changes
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
      - run: npm run setup:ci
      - run: npm run check
      - run: npm run build
      - run: npm test
      - run: npm run test:work-animation
      - run: npm run test:windows:contract
      - name: Check identity on three fresh WinForms and Electron fixtures
        run: |
          1..3 | ForEach-Object {
            npm run test:windows:identity
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - run: npm run test:windows:coordination
