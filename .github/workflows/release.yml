name: Desktop release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            arch: x64
          - os: macos-15-intel
            platform: macos
            arch: x64
          - os: macos-15
            platform: macos
            arch: arm64
          - os: ubuntu-24.04
            platform: linux
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
      - name: Check release version and architecture
        shell: bash
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          node -e "const p=require('./package.json'); if(process.arch!==process.env.EXPECTED_ARCH) throw Error('Unexpected build architecture'); if(process.env.GITHUB_REF_TYPE==='tag' && process.env.GITHUB_REF_NAME!=='v'+p.version) throw Error('Tag and package version differ');"
      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb zip unzip libgtk-3-0t64 libnss3 libasound2t64 libxtst6 libxkbcommon0 libgbm1 libxss1 libatk-bridge2.0-0t64 dbus-x11
      - run: npm run setup:ci
      - run: npm run check
      - run: npm run build
      - run: npm test
      - run: npm run package:desktop
      - name: Build Windows MCP installers
        if: runner.os == 'Windows'
        run: npm run package:windows
      - name: Verify Windows MCP installers
        if: runner.os == 'Windows'
        run: npm run test:package
      - name: Test extracted app and MCP connection
        if: runner.os != 'Linux'
        run: npm run test:desktop-package
      - name: Test Linux extracted app and MCP connection
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:desktop-package
      - name: Test client-native extension and plugin packages
        if: runner.os != 'Linux'
        run: npm run test:client-package
      - name: Test Linux local-plugin package
        if: runner.os == 'Linux'
        run: xvfb-run -a dbus-run-session -- npm run test:client-package
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/pokemon-companion-*-plugin-*.zip
            release/pokemon-companion-*-plugin-*.zip.sha256
            release/pokemon-companion-*-claude-*.mcpb
            release/pokemon-companion-*-claude-*.mcpb.sha256
            release/pokemon-companion-win32-x64.zip
            release/pokemon-companion-win32-x64.mcpb
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release
      - name: Verify and publish release ZIPs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release
          cat *.zip.sha256 *.mcpb.sha256 > SHA256SUMS.txt
          test "$(find . -maxdepth 1 -name '*.zip' | wc -l)" -eq 5
          test "$(find . -maxdepth 1 -name '*.mcpb' | wc -l)" -eq 4
          sha256sum -c SHA256SUMS.txt
          sha256sum pokemon-companion-win32-x64.zip pokemon-companion-win32-x64.mcpb >> SHA256SUMS.txt
          cd ..
          version="v$(node -p "require('./package.json').version")"
          if ! gh release view "$version" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$version" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Pokemon Companion $version" --draft --notes-file packaging/desktop-release-notes.md
          fi
          gh release upload "$version" release/*.zip release/*.mcpb release/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$version" --repo "$GITHUB_REPOSITORY" --draft=false --notes-file packaging/desktop-release-notes.md
